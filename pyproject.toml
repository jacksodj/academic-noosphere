[project]
name = "noosphere"
version = "0.1.0"
description = "Academic Noosphere core: survey pipeline, graph, and gap analysis behind a localhost API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Wired in as their tickets resolve (#11 ingestion, #12 gap analysis):
# graph = ["ladybug", "python-igraph", "duckdb"]
# aws = ["boto3", "mcp", "mcp-proxy-for-aws", "anthropic[bedrock]"]

[project.scripts]
noosphere-core = "noosphere.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noosphere"]
