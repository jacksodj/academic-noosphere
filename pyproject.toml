[project]
name = "noosphere"
version = "0.1.0"
description = "Academic Noosphere core: survey pipeline, graph, and gap analysis behind a localhost API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "duckdb>=1.5",
    "ladybug>=0.19",
    "igraph>=0.11",
    "boto3>=1.34",
    "anthropic>=1.0",
    "keyring>=25",
]

[project.optional-dependencies]
# Heavy/optional at runtime:
embed = ["sentence-transformers>=3.0"]        # SPECTER2 local embedding (~440MB model)
# Torch-free SPECTER2 inference for the packaged app (ticket #22): the ONNX
# export produced by scripts/export_specter2_onnx.py + a fast tokenizer.
onnx = [
    "onnxruntime>=1.19",
    "tokenizers>=0.20",
    "numpy>=1.26",
]
# mcp<2 + pydantic-settings: fastmcp 2.14.0 (pulled in by mcp-proxy-for-aws)
# breaks on the mcp 2.0 SDK (McpError moved) and imports pydantic_settings
# without declaring it; both constraints keep the import working at runtime.
websearch = [
    "mcp>=1.0,<2",
    "mcp-proxy-for-aws>=1.0",
    "pydantic-settings>=2",
]  # Gateway MCP client (SigV4)

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
noosphere-core = "noosphere.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noosphere"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
